---
# Local benchmark services use disposable credentials. Host access is loopback
# by default; agent containers communicate over agentprivarena-net.
services:
  # ── BookStack (wiki / knowledge base) ──
    bookstack:
        image: lscr.io/linuxserver/bookstack@sha256:3014bc25b8cef82a7fd8ba9c1e2cdb5d9b0cc5d56f86c26ca1e9bdc1da5d38f8
        environment:
            - APP_KEY=base64:5ImzXxb4R9bscTyfqElm/GAvXuhZd4lvWX5cqDzzPCA=
            - APP_URL=http://bookstack:80
            - DB_HOST=bookstack-db
            - DB_PORT=3306
            - DB_USERNAME=bookstack
            - DB_PASSWORD=bookstack
            - DB_DATABASE=bookstack
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${BOOKSTACK_HOST_PORT:-3000}:80
        networks:
            - agentprivarena-net
        depends_on:
            bookstack-db:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: [CMD, curl, -sf, http://localhost:80/status]
            interval: 15s
            timeout: 5s
            retries: 15
            start_period: 60s

    bookstack-db:
        image: mariadb:11
        environment:
            MYSQL_ROOT_PASSWORD: bookstack
            MYSQL_DATABASE: bookstack
            MYSQL_USER: bookstack
            MYSQL_PASSWORD: bookstack
        volumes:
            - bookstack-db-data:/var/lib/mysql
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: [CMD, healthcheck.sh, --connect]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s

  # ── Mattermost (direct messaging) ──
    mattermost:
        image: mattermost/mattermost-team-edition@sha256:88565cb169f3ca5e6303db3f99c98297763b3fc606fa464f9382393b328ecdb9
        environment:
            MM_SQLSETTINGS_DRIVERNAME: postgres
            MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmpass@mattermost-db:5432/mattermost?sslmode=disable
            MM_SERVICESETTINGS_SITEURL: http://mattermost:8065
            MM_SERVICESETTINGS_ENABLEAPIUSERDELETION: 'true'
            MM_TEAMSETTINGS_ENABLEOPENSERVER: 'true'
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${MATTERMOST_HOST_PORT:-8065}:8065
        networks:
            - agentprivarena-net
        depends_on:
            mattermost-db:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: [CMD, mattermost, version]
            interval: 15s
            timeout: 5s
            retries: 15
            start_period: 90s

    mattermost-db:
        image: postgres:15
        environment:
            POSTGRES_DB: mattermost
            POSTGRES_USER: mmuser
            POSTGRES_PASSWORD: mmpass
        volumes:
            - mattermost-db-data:/var/lib/postgresql/data
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: [CMD-SHELL, pg_isready -U mmuser -d mattermost]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

  # ── RocketChat (team chat / channels) ──
    rocketchat:
        image: rocket.chat@sha256:b6cfd507cf913290045d380be2c14511c735acb840509d471fb2d7359a820031
        environment:
            MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
            MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0
            ROOT_URL: http://rocketchat:3000
            OVERWRITE_SETTING_Show_Setup_Wizard: completed
            ADMIN_USERNAME: admin
            ADMIN_PASS: admin
            ADMIN_EMAIL: admin@agentprivarena.local
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${ROCKETCHAT_HOST_PORT:-3100}:3000
        networks:
            - agentprivarena-net
        depends_on:
            mongo:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: >
                /usr/local/bin/node -e
                'const http=require("http");const o={hostname:"localhost",port:3000,path:"/api/info",method:"GET"};const r=http.request(o,s=>{process.exit(s.statusCode===200?0:1)});r.on("error",()=>process.exit(1));r.end()'
            interval: 15s
            timeout: 5s
            retries: 15
            start_period: 60s

    mongo:
        image: mongo:6
        command: mongod --replSet rs0 --oplogSize 128
        volumes:
            - mongo-data:/data/db
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: >
                mongosh --eval "try{rs.status()}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]})}"
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

  # ── Mailpit (email) ──
    mailpit:
        image: axllent/mailpit@sha256:757f22b56c1da03570afdb3d259effe5091018008a81bbedc8158cee7e16fdbc
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${MAILPIT_HTTP_HOST_PORT:-8025}:8025
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1025}:1025
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: [CMD, wget, -qO-, http://localhost:8025/api/v1/info]
            interval: 10s
            timeout: 3s
            retries: 5

  # ── GoToSocial (social media) ──
    gotosocial:
        image: superseriousbusiness/gotosocial@sha256:53106462f352c23c25a32d4bd5c03eb3c2198f2d2549ff1e7d5ef6deb7f44961
        environment:
            GTS_HOST: gotosocial
            GTS_DB_TYPE: sqlite
            GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
            GTS_ACCOUNTS_REGISTRATION_OPEN: 'true'
            GTS_ACCOUNTS_APPROVAL_REQUIRED: 'false'
        volumes:
            - gotosocial-data:/gotosocial/storage
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${GOTOSOCIAL_HOST_PORT:-4000}:8080
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: [CMD, wget, -qO-, http://localhost:8080/nodeinfo/2.0]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 15s

  # ── Radicale (calendar) ──
    radicale:
        image: tomsquest/docker-radicale@sha256:29820fdd510bb0251bf48277cf71f4726e01a2d0de12001a7b1da3ac0ad7ab97
        volumes:
            - radicale-data:/data
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${RADICALE_HOST_PORT:-5232}:5232
        networks:
            - agentprivarena-net
        restart: unless-stopped
        healthcheck:
            test: [CMD, curl, -sf, http://localhost:5232/.web/]
            interval: 10s
            timeout: 3s
            retries: 5

  # ── MCP Servers ──
  # MCP server containers source their credentials from agentprivarena/.env,
  # which is generated by Config.write_env_file (see agentprivarena/config.py).
  # Run `python -m agentprivarena setup` (or `write-env`) before `docker compose up`.

    bookstack-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python bookstack_server.py
        environment:
            BOOKSTACK_URL: http://bookstack:80
            BOOKSTACK_TOKEN_ID: ${BOOKSTACK_TOKEN_ID}
            BOOKSTACK_TOKEN_SECRET: ${BOOKSTACK_TOKEN_SECRET}
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${BOOKSTACK_MCP_HOST_PORT:-9001}:8080
        networks:
            - agentprivarena-net
        depends_on:
            bookstack:
                condition: service_healthy
        restart: unless-stopped

    mattermost-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python mattermost_server.py
        environment:
            MATTERMOST_URL: http://mattermost:8065
            MATTERMOST_USER: ${MATTERMOST_USER}
            MATTERMOST_PASSWORD: ${MATTERMOST_PASSWORD}
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${MATTERMOST_MCP_HOST_PORT:-9002}:8080
        networks:
            - agentprivarena-net
        depends_on:
            mattermost:
                condition: service_healthy
        restart: unless-stopped

    rocketchat-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python rocketchat_server.py
        environment:
            ROCKETCHAT_URL: http://rocketchat:3000
            ROCKETCHAT_USER: ${ROCKETCHAT_USER}
            ROCKETCHAT_PASSWORD: ${ROCKETCHAT_PASSWORD}
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${ROCKETCHAT_MCP_HOST_PORT:-9003}:8080
        networks:
            - agentprivarena-net
        depends_on:
            rocketchat:
                condition: service_healthy
        restart: unless-stopped

    mailpit-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python mailpit_server.py
        environment:
            MAILPIT_API_URL: http://mailpit:8025
            MAILPIT_SMTP_HOST: mailpit
            MAILPIT_SMTP_PORT: '1025'
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${MAILPIT_MCP_HOST_PORT:-9004}:8080
        networks:
            - agentprivarena-net
        depends_on:
            mailpit:
                condition: service_healthy
        restart: unless-stopped

    gotosocial-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python gotosocial_server.py
        environment:
            GOTOSOCIAL_URL: http://gotosocial:8080
            GOTOSOCIAL_TOKEN: ${GOTOSOCIAL_TOKEN}
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${GOTOSOCIAL_MCP_HOST_PORT:-9005}:8080
        networks:
            - agentprivarena-net
        depends_on:
            gotosocial:
                condition: service_healthy
        restart: unless-stopped

    radicale-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python radicale_server.py
        environment:
            RADICALE_URL: http://radicale:5232
            RADICALE_USER: ${RADICALE_USER}
            RADICALE_PASSWORD: ${RADICALE_PASSWORD}
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${RADICALE_MCP_HOST_PORT:-9006}:8080
        networks:
            - agentprivarena-net
        depends_on:
            radicale:
                condition: service_healthy
        restart: unless-stopped

    google-drive-mcp:
        build:
            context: ./mcp_servers
            dockerfile: Dockerfile
        command: python google_drive_server.py
        environment:
            GOOGLE_DRIVE_ARTIFACT_ROOT: /artifacts
            GOOGLE_DRIVE_VISION_MODEL: ${GOOGLE_DRIVE_VISION_MODEL:-}
            GOOGLE_DRIVE_VISION_BASE_URL: ${GOOGLE_DRIVE_VISION_BASE_URL:-}
            GOOGLE_DRIVE_VISION_API_KEY: ${GOOGLE_DRIVE_VISION_API_KEY:-}
            GOOGLE_DRIVE_VISION_API_VERSION: ${GOOGLE_DRIVE_VISION_API_VERSION:-}
        volumes:
            - ${GOOGLE_DRIVE_ARTIFACT_HOST_ROOT:-../.agent_tmp/agentprivarena_artifacts/google_drive}:/artifacts:ro
        ports:
            - ${AGENTPRIVARENA_BIND_HOST:-127.0.0.1}:${GOOGLE_DRIVE_MCP_HOST_PORT:-9007}:8080
        networks:
            - agentprivarena-net
        restart: unless-stopped

volumes:
    bookstack-db-data:
    mattermost-db-data:
    mongo-data:
    gotosocial-data:
    radicale-data:

networks:
    agentprivarena-net:
        driver: bridge
